name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Version and changelog
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          from backend.version import VERSION
          ref = os.environ.get("GITHUB_REF_NAME", "manual")
          if ref.startswith("v"):
              tag_version = ref[1:]
              assert tag_version == VERSION or tag_version.startswith(VERSION + "-rc"), (tag_version, VERSION)
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          assert f"## [{VERSION}]" in text, "CHANGELOG has no section for the version"
          print("version verified:", VERSION)
          PY
      - name: Privacy guard
        run: python scripts/privacy_guard.py
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  build-windows:
    name: Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller==6.22.3
      - name: Generate notices and build
        shell: pwsh
        run: |
          python scripts/generate_notices.py
          python scripts/build_exe.py
      - name: Portable zip
        shell: pwsh
        run: |
          $version = python -c "from backend.version import VERSION; print(VERSION)"
          Copy-Item packaging/windows/README-PORTABLE.txt dist/BackupLens/README-PORTABLE.txt
          Compress-Archive -Path dist/BackupLens/* -DestinationPath "dist/BackupLens-$version-windows-x64-portable.zip"
          $exe = "dist/BackupLens/BackupLens.exe"
          $smoke = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { exit $smoke.ExitCode }
      - name: Inno Setup installer
        shell: pwsh
        run: |
          $version = python -c "from backend.version import VERSION; print(VERSION)"
          choco install innosetup --no-progress -y --version=6.4.0
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "packaging\windows\backuplens.iss"
          $installer = "dist/installer/BackupLens-$version-windows-x64-setup.exe"
          $target = Join-Path $env:TEMP "BackupLens-ci-install"
          $install = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          $smoke = Start-Process -FilePath "$target\BackupLens.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { exit $smoke.ExitCode }
          $uninstall = Start-Process -FilePath "$target\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { exit $uninstall.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/installer/*.exe
            dist/*-windows-x64-portable.zip
          if-no-files-found: error

  build-macos-arm64:
    name: macOS arm64
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller==6.22.3
      - name: Build, sign ad-hoc, package
        run: |
          python scripts/generate_notices.py
          bash packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/macos/*.zip
            dist/*-macos-arm64.dmg
          if-no-files-found: error

  build-macos-x86_64:
    name: macOS Intel
    needs: verify
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller==6.22.3
      - name: Build, sign ad-hoc, package
        run: |
          python scripts/generate_notices.py
          bash packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            dist/macos/*.zip
            dist/*-macos-x86_64.dmg
          if-no-files-found: error

  build-linux:
    name: Linux x86_64
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller==6.22.3
      - name: Build packages
        env:
          APPIMAGETOOL_SHA256: ${{ env.APPIMAGETOOL_SHA256 }}
        run: |
          python scripts/generate_notices.py
          bash packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/BackupLens-*.AppImage
            dist/BackupLens-*.deb
            dist/linux/*.tar.gz
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos-arm64, build-macos-x86_64, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums and notes
        run: |
          VERSION=$(python -c "from backend.version import VERSION; print(VERSION)")
          cd release-assets
          find . -type f ! -name SHA256SUMS.txt -print0 | xargs -0 sha256sum | sed 's#  ./#  #' > ../SHA256SUMS.txt
          cd ..
          {
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1} on && /^## \\[/ && $0 !~ v {exit} on {print}' CHANGELOG.md
            echo
            echo "Corresponding source: https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}"
            echo
            echo "Third-party notices and source links are included in THIRD_PARTY_NOTICES.txt in every artifact."
          } > release-notes.md
          cat SHA256SUMS.txt >> release-notes.md
      - name: Create draft pre-release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          name: BackupLens ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/**
            SHA256SUMS.txt
