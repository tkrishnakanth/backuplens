name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Privacy guard (forbidden files, device IDs, local paths, secret-like strings)
        run: python scripts/privacy_guard.py
      - name: Lint
        run: ruff check .
      - name: Tests (unit + contract; integration tests are deselected)
        run: pytest -q
      - name: Verify the frontend is self-contained (no external URLs)
        shell: pwsh
        run: |
          $files = Get-ChildItem frontend -Recurse -Include *.html,*.css,*.js
          $hits = $files | Select-String -Pattern 'https?://(?!127\.0\.0\.1|localhost|www\.w3\.org)' -AllMatches
          if ($hits) { $hits | ForEach-Object { Write-Error $_.Line }; exit 1 }
