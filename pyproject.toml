[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "backuplens"
dynamic = ["version"]
description = "Local-only browser and exporter for photos in encrypted iOS backups"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }

[tool.setuptools.dynamic]
version = { attr = "backend.version.VERSION" }

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: talks to a real backup via BACKUP_PATH/BACKUP_PASSWORD (skipped when unset)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"project-docs/spike_unlock.py" = ["E402"]
